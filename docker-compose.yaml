services:
  mongo:
    image: mongo:7
    container_name: taskflow-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    image: vishvik/taskflow-backend:latest
    container_name: taskflow-backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/taskflow
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    image: vishvik/taskflow-frontend:latest
    container_name: taskflow-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data: